name: premake5-ubuntu

on:
  workflow_dispatch:
  push:
    paths:
      - 'resinstaller/**'
      - 'src/**'
      - 'submodules/**'
      - 'test/**'
      - '.github/workflows/premake5-ubuntu.yml'
      - 'premake5.lua'
      - '!**.md'
      - '!**/.clang-format'

  pull_request:
    paths:
      - 'resinstaller/**'
      - 'src/**'
      - 'submodules/**'
      - 'test/**'
      - '.github/workflows/premake5-ubuntu.yml'
      - 'premake5.lua'
      - '!**.md'
      - '!**/.clang-format'
      
jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: apt-get update
      run: sudo apt-get update

    - name: install dependencies
      run: |
        sudo apt-get install libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev libogg-dev libvorbis-dev libvorbisenc2 libvorbisidec-dev

    - name: install premake5
      uses: Jarod42/install-premake5@v7

    - name: run premake5
      run: premake5 gmake --to=solution/gmake

    - name: build executables
      run: |
        cd solution/gmake
        make config=release -j4 maxr dedicated_server resinstaller

    - name: run tests
      run: |
        cd solution/gmake
        make config=release -j4 tests
        cd bin/Release
        ./maxr_tests
