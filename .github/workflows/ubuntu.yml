name: ubuntu

on:
  workflow_dispatch:
  push:
    paths:
      - 'resinstaller/src/**'
      - 'src/**'
      - 'submodules/**'
      - 'tests/**'
      - '.github/workflows/ubuntu.yml'
      - 'CMakeLists.txt'
      - 'mk/cmake/**'

  pull_request:
    paths:
      - 'resinstaller/src/**'
      - 'src/**'
      - 'submodules/**'
      - 'tests/**'
      - '.github/workflows/ubuntu.yml'
      - 'CMakeLists.txt'
      - 'mk/cmake/**'

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runs-on: ['ubuntu-latest', 'ubuntu-26.04-arm']

    runs-on: ${{ matrix.runs-on }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: apt-get update
      run: sudo apt-get update

    - name: install dependencies
      run: |
        sudo apt-get install libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev libogg-dev libvorbis-dev libvorbisenc2 libvorbisidec-dev

    - name: cmake --version
      run: cmake --version

    - name: test projects
      run: |
        mkdir build && cd build
        cmake .. -DBUILD_TESTING=1
        make maxr_dedicatedserver maxr maxr_tests resinstaller -j4
        ctest
        ./maxr_tests

